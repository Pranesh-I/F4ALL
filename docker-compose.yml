services:
  postgres:
    image: postgres:16-alpine
    container_name: f4all-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: f4all_db
      POSTGRES_USER: f4all_user
      POSTGRES_PASSWORD: f4all_password

    ports:
      # 5433 on the host so an existing local Postgres is not shadowed.
      - "5434:5432"

    volumes:
      - f4all_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f4all_user -d f4all_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery broker and result backend for server-side re-verification (Sprint 5).
  redis:
    image: redis:7-alpine
    container_name: f4all-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    # Verification jobs are re-queued from the database by
    # `python -m app.cli reverify-pending`, so the broker is a cache rather than
    # a system of record and does not need persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # The backend itself. Behind the "app" profile, so `docker compose up`
  # still starts only the databases for running the API from a virtualenv;
  # `docker compose --profile app up --build` runs the whole stack.
  # ------------------------------------------------------------------

  # Applies migrations once, then exits. The API and worker wait for it.
  migrate:
    profiles: ["app"]
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://f4all_user:f4all_password@postgres:5432/f4all_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /app/var/storage
      UPLOAD_STAGING_PATH: /app/var/uploads
      PUBLIC_BASE_URL: http://localhost:${F4ALL_API_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: ./backend
    environment: *backend_env
    ports:
      - "${F4ALL_API_PORT:-8000}:8000"
    volumes:
      - f4all_storage:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Server-side re-verification. Shares the API's storage so it can read the
  # uploaded videos; in production both use S3 instead.
  worker:
    profiles: ["app"]
    build: ./backend
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *backend_env
    volumes:
      - f4all_storage:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  f4all_postgres_data:
  f4all_storage:
