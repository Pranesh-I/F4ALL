name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -d mobile
          test -d backend
          test -d dashboard
          test -d docs

      - name: CI passed
        run: echo "Project structure check passed"